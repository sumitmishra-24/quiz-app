<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Master</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <header class="app-header">
        <h1>Quiz Master</h1>

        <div class="settings">
          <button id="theme-btn" class="utility-btn" type="button">
            🌙 Dark Mode
          </button>

          <button id="sound-btn" class="utility-btn" type="button">
            🔊 Sound On
          </button>
        </div>
      </header>

      <p id="intro-text">Test your knowledge and challenge yourself!</p>

      <!-- Setup Screen -->
      <section id="setup-screen">
        <label for="category">Choose Category</label>

        <select id="category">
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="JavaScript">JavaScript</option>
        </select>

        <label for="difficulty">Choose Difficulty</label>

        <select id="difficulty">
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>

        <button id="start-btn" class="full-width-btn">Start Quiz</button>
      </section>

      <!-- Quiz Screen --->
      <section id="quiz-screen" style="display: none">
        <div class="quiz-info">
          <span id="quiz-category"></span>
          <span id="timer">Time: 15s</span>
        </div>

        <div class="progress-info">
          <span id="progress"></span>

          <div class="progress-bar">
            <div id="progress-fill"></div>
          </div>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <div class="button-group">
          <button id="back-btn" class="secondary-btn">Back to Setup</button>

          <button id="next-btn" style="display: none">Next Question</button>
        </div>
      </section>

      <!-- Result Screen -->
      <section id="result-screen" style="display: none">
        <h2>Quiz Completed!</h2>

        <p id="final-score"></p>
        <p id="percentage"></p>
        <p id="performance"></p>
        <p id="best-score"></p>

        <button id="restart-btn" class="full-width-btn">Choose Again</button>

        <button id="view-history-btn" class="full-width-btn secondary-btn">
          View Quiz History
        </button>
      </section>

      <!-- Quiz History Screen -->
      <section id="history-screen" style="display: none">
        <h2>Quiz History</h2>

        <div id="history-list"></div>

        <button id="back-to-setup-btn" class="full-width-btn">
          Back to Setup
        </button>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
